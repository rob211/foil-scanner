name: calibrate

# Weekly, Mondays 20:10 UTC (Tuesday morning in Sydney). Nothing depends on
# anyone remembering to run it - which is the point: a correction that has
# drifted is silent by nature, and the whole system is built so that silence
# is never the failure mode.
#
# The job goes RED when what is measured no longer matches what is applied,
# which sends GitHub's failure email. It changes nothing on its own; the
# constants stay a deliberate decision.
on:
  schedule:
    - cron: "10 20 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # calibrate_wind.py reads the observation history out of the git
          # log of data/live.json. The default shallow clone has none of it,
          # and the script would silently find nothing to compare.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt

      - name: Tide against the Port Kembla gauge
        run: python scripts/calibrate_tide.py 14 --check

      - name: Wind against both stations
        # always() so a tide drift does not hide a wind drift: both answers
        # are wanted on the same run, not whichever fails first.
        if: always()
        run: python scripts/calibrate_wind.py 60 --check
