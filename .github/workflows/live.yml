name: live

on:
  schedule:
    # BACKSTOP ONLY. The real cadence comes from the Cloudflare Worker in
    # cron-worker/, which dispatches this workflow every 30 min in daylight
    # and hourly overnight. GitHub's `schedule` queue is deprioritised under
    # load and shed 10 of ~13 live ticks on 10 Aug 2026, with gaps up to
    # 142 min - not something to hang a wind alert on.
    #
    # This tick exists so a dead Worker degrades the cadence instead of
    # stopping it. It was 3-hourly to save Actions minutes - but this repo is
    # public, where GitHub Actions is free and unmetered, so that reasoning
    # was wrong and the backstop was needlessly thin. Hourly costs nothing
    # and means a dead Worker degrades to hourly rather than to 3-hourly.
    # live.py's poll_gap_note still reports the degraded cadence.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      token_expires_at:
        description: >-
          When the dispatching PAT expires. Set by the Cloudflare Worker from
          GitHub's github-authentication-token-expiration header; only it
          holds the token, so nothing else can measure this. Empty on a
          manual or scheduled run, which the scanner treats as "unknown",
          not as "fine".
        required: false
        type: string

concurrency:
  # Per-workflow, NOT shared. A shared group meant scan and live collided
  # every even hour when the Worker dispatched both in the same second, and
  # GitHub cancels a pending run that a newer one displaces - silently: no
  # non-zero exit, so no failure email, no SCANNER BROKEN event, and no
  # data written for anything downstream to notice. One scan was lost that
  # way on 10 Aug 2026 before anyone looked.
  #
  # The two jobs write different files, so they no longer need serialising;
  # the push retry below handles the race they can still lose.
  group: foil-scanner-live
  cancel-in-progress: false

permissions:
  contents: write
  issues: write  # failure_report.py

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Verify live conditions
        env:
          GCAL_SERVICE_ACCOUNT_JSON: ${{ secrets.GCAL_SERVICE_ACCOUNT_JSON }}
          FOIL_CALENDAR_ID: ${{ secrets.FOIL_CALENDAR_ID }}
          HOLFUY_KEY: ${{ secrets.HOLFUY_KEY }}
          FOIL_TOKEN_EXPIRES_AT: ${{ inputs.token_expires_at }}
          PYTHONUNBUFFERED: "1"
        # --force on a dispatched run: the Cloudflare Worker already applied
        # the cadence rule before asking, and re-applying it against the time
        # GitHub happens to start the job only ever drops ticks. The schedule
        # backstop arrives ungated and keeps the check.
        # tee keeps the output for the diagnosis step; pipefail keeps the
        # scanner's exit code instead of tee's.
        run: |
          set -o pipefail
          python -m foilscan live ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} 2>&1 | tee "$RUNNER_TEMP/run.log"
      - name: Commit live data
        # A failed verify can still have written a useful live.json (spec 8.9).
        if: always()
        run: |
          git config user.name "foil-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "data: live $(date -u +%FT%TZ)"
            # Retry: without the shared concurrency group the other workflow
            # can land a commit between our rebase and our push. Different
            # files, so the rebase itself merges cleanly - it is only the
            # push that races.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt lost the race, retrying"
              sleep $((attempt * 3))
            done
          fi
      - name: Email a diagnosis
        # GitHub's own failure email only says "failed (N annotations)".
        # This files the cause, in plain English, as an issue that mentions
        # the owner; repeats edit it silently. See scripts/failure_report.py.
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # The log is quoted into a public issue; these are scrubbed first.
          REDACT_GCAL: ${{ secrets.GCAL_SERVICE_ACCOUNT_JSON }}
          REDACT_CAL: ${{ secrets.FOIL_CALENDAR_ID }}
          REDACT_HOLFUY: ${{ secrets.HOLFUY_KEY }}
        run: python3 scripts/failure_report.py fail live "$RUNNER_TEMP/run.log"
      - name: Close a recovered diagnosis
        if: success()
        # Never turn a green run red over issue housekeeping.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/failure_report.py recovered live
