name: scan

on:
  schedule:
    # Backstop for the Cloudflare Worker in cron-worker/, which drives the
    # real cadence. Back to 2-hourly, matching the Worker: this repo is
    # public, so Actions is free and the 4-hourly thinning bought nothing.
    # The live heartbeat fails the run once latest.json is 8 h old, and a
    # 2 h backstop clears that even if GitHub sheds several in a row.
    # (GitHub sheds `schedule` heavily under load - see cron-worker/README.)
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      token_expires_at:
        description: >-
          Declared but unused here. The Worker sends the same inputs to both
          workflows and GitHub rejects a dispatch carrying an input the
          workflow does not declare, so this has to exist. The escalation
          itself lives in the live job, which runs often enough to matter.
        required: false
        type: string

concurrency:
  # Per-workflow, NOT shared. A shared group meant scan and live collided
  # every even hour when the Worker dispatched both in the same second, and
  # GitHub cancels a pending run that a newer one displaces - silently: no
  # non-zero exit, so no failure email, no SCANNER BROKEN event, and no
  # data written for anything downstream to notice. One scan was lost that
  # way on 10 Aug 2026 before anyone looked.
  #
  # The two jobs write different files, so they no longer need serialising;
  # the push retry below handles the race they can still lose.
  group: foil-scanner-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Run scanner
        env:
          GCAL_SERVICE_ACCOUNT_JSON: ${{ secrets.GCAL_SERVICE_ACCOUNT_JSON }}
          FOIL_CALENDAR_ID: ${{ secrets.FOIL_CALENDAR_ID }}
        run: python -m foilscan scan
      - name: Commit verdict data
        # Partial-failure runs still write a verdict worth keeping (spec 8.9).
        if: always()
        run: |
          git config user.name "foil-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: scan $(date -u +%FT%TZ)"
          # Retry: without the shared concurrency group the live job can land
          # a commit between our rebase and our push. Different files, so the
          # rebase merges cleanly - it is only the push that races.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push attempt $attempt lost the race, retrying"
            sleep $((attempt * 3))
          done
